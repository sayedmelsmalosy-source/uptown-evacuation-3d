name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Uptown BIM viewer package (uptown-bim.zip from Google Drive, if configured)
        run: |
          if [ -f uptown-bim.src ]; then
            ID=$(tr -d ' \n' < uptown-bim.src)
            pip install -q gdown
            gdown "https://drive.google.com/uc?id=$ID" -O uptown-bim.zip
            rm -rf uptown-bim uptown-bim-tmp && mkdir -p uptown-bim && unzip -q -o uptown-bim.zip -d uptown-bim-tmp
            if [ -d uptown-bim-tmp/uptown-bim ]; then mv uptown-bim-tmp/uptown-bim/* uptown-bim/; else mv uptown-bim-tmp/* uptown-bim/; fi
            rm -rf uptown-bim-tmp uptown-bim.zip
            ls uptown-bim | head
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
